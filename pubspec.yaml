name: pss_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  animate_do: ^5.1.0
  animations: ^3.0.0
  bloc: ^9.2.1
  cached_network_image: ^4.0.0
  carousel_slider: ^5.1.2
  change_app_package_name: ^1.5.0
  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  dropdown_button2: ^3.1.0
  envied: ^1.3.9
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_switch: ^0.3.2
  fpdart: ^1.2.0
  get_it: ^9.2.0
  go_router: ^18.0.1
  iconify_flutter_plus: ^1.0.4
  image_picker: ^1.2.0
  internet_connection_checker_plus: ^3.0.0
  intl: ^0.20.2
  loader_overlay: ^5.0.0
  meta: ^1.16.0
  paged_vertical_calendar: ^1.1.10
  shared_preferences: ^2.5.4
  shimmer: ^4.0.0
  syncfusion_flutter_barcodes: ^34.2.4
  timelines_plus: ^2.0.0

dev_dependencies:
  build_runner: ^2.16.1
  envied_generator: ^1.3.9
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppin/Poppins-Bold.ttf
        - asset: assets/fonts/poppin/Poppins-SemiBold.ttf
        - asset: assets/fonts/poppin/Poppins-Medium.ttf
        - asset: assets/fonts/poppin/Poppins-Regular.ttf
        - asset: assets/fonts/poppin/Poppins-Light.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Light.ttf
